name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: swift test

  # Tag v1.2.3 → GitHub Release with Voce.zip (what scripts/install.sh downloads).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set version from tag
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" Voce/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" Voce/Info.plist
      # Sempre lo stesso certificato (scripts/release-cert.sh): così i permessi di macOS restano validi dopo un
      # aggiornamento. Senza i secret la release non parte, invece di uscire firmata ad-hoc.
      - name: Build and sign
        env:
          VOCE_CERT_P12: ${{ secrets.VOCE_CERT_P12 }}
          VOCE_CERT_PASSWORD: ${{ secrets.VOCE_CERT_PASSWORD }}
        run: |
          [[ -n "$VOCE_CERT_P12" ]] || { echo "::error::Mancano i secret VOCE_CERT_P12 e VOCE_CERT_PASSWORD (scripts/release-cert.sh)"; exit 1; }
          scripts/build.sh
          codesign -d -r- build/Voce.app 2>&1 | grep -q "certificate leaf" || { echo "::error::Voce.app non è firmata con il certificato delle release"; exit 1; }
      - run: ditto -c -k --keepParent build/Voce.app Voce.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Voce.zip --title "Voce $GITHUB_REF_NAME" --generate-notes
